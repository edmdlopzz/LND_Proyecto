<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mundo Mueble</title>
    <link rel="stylesheet" href="CSS/estilosmuebles.css">
</head>

<body>

<!-- VIDEO DE FONDO GLOBAL -->
<video autoplay muted loop playsinline id="video-fondo">
    <source src="VIDEOS/video lluvia.mp4" type="video/mp4">
</video>

<!-- CABECERA -->
<header class="cabecera">
    <h1>Mundo Mueble</h1>
</header>

<!-- MENÚ -->
<nav class="menu">
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Novedades</a>
    <a href="formulario.html">Registrate</a>
</nav>

<!-- DESCUENTO -->
<section class="descuento">
    <video autoplay muted loop playsinline class="video-fondo">
        <source src="VIDEOS/Sale.mp4" type="video/mp4">
    </video>
    <h2>10% Descuento</h2>
</section>
<div class="contenido-extra" id="extra-descuento">
    <img src="FOTOS/MUEBLE1.jpg">
    <img src="FOTOS/MUEBLE2.jpg">
    <img src="FOTOS/MUEBLE3.jpg">
 <img src="FOTOS/MUEBLE10.jpg">
</div>

<!-- NOVEDADES -->
<section class="novedades">
    <h2>Novedades</h2>
</section>  
<div class="contenido-extra" id="extra-novedades">
    <img src="FOTOS/MUEBLE5.jpg">
    <img src="FOTOS/MUEBLE6.jpg">
    <img src="FOTOS/MUEBLE7.jpg">
 <img src="FOTOS/MUEBLE8.jpg">
</div>

<!-- TARJETAS -->
<section class="tarjetas">

    <div class="tarjeta">
        <h3>Salón</h3>
        <div class="galeria">
            <img src="FOTOS/salon1.jpg">
            <img src="FOTOS/salon2.jpg">
            <img src="FOTOS/salon3.jpg">
        </div>
    </div>

    <div class="tarjeta">
        <h3>Dormitorios</h3>
        <div class="galeria">
            <img src="FOTOS/cuarto1.jpg">
            <img src="FOTOS/cuarto2.jpg">
            <img src="FOTOS/cuarto3.jpg">
        </div>
    </div>

    <div class="tarjeta">
        <h3>Baños</h3>
        <div class="galeria">
            <img src="FOTOS/baño1.jpg">
            <img src="FOTOS/baño2.jpg">
            <img src="FOTOS/baño3.jpg">
        </div>
    </div>

</section>

<footer class="footer">
    <p>© 2026 Mundo Mueble</p>
</footer>

<script>
    // Mensaje del menú
    document.querySelector(".menu a").addEventListener("click", function(event) {
        event.preventDefault();
        alert("¡Bienvenido a Mundo Mueble!");
    });

   
    document.querySelector(".descuento").addEventListener("click", function() {
        let contenido = document.getElementById("extra-descuento");
        contenido.style.display = contenido.style.display === "flex" ? "none" : "flex";
    });

    
    document.querySelector(".novedades").addEventListener("click", function() {
        let contenido = document.getElementById("extra-novedades");
        contenido.style.display = contenido.style.display === "flex" ? "none" : "flex";
    });
</script>

</body>
</html>
